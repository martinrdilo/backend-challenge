server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful
  tomcat:
    remoteip:
      internal-proxies: .*

spring:
  application:
    name: backend-notifications
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

external:
  api:
    photos:
      base-url: ${EXTERNAL_API_BASE_URL:https://jsonplaceholder.typicode.com}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

rate-limit:
  login-attempts-per-minute: 5
  register-attempts-per-minute: 3
  window-minutes: 1

notifications:
  dispatch:
    retry:
      max-attempts: 3
      delay-ms: 1000
      multiplier: 2.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    io.backend: DEBUG

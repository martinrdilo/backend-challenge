# Test profile configuration
# Datasource properties are overridden dynamically by Testcontainers
# via @DynamicPropertySource in AbstractIntegrationTest

spring:
  datasource:
    # url, username, password are overridden by @DynamicPropertySource
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

# External API base-url: overridden dynamically by WireMock
# via @DynamicPropertySource in AbstractIntegrationTest
external:
  api:
    jsonplaceholder:
      base-url: http://localhost:0

jwt:
  secret: dGVzdHNlY3JldGtleWZvcnRlc3Rpbmd3aXRoZW5vdWdoYnl0ZXM=
  expiration-ms: 86400000

notifications:
  dispatch:
    retry:
      delay-ms: 0

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# High rate limits for tests — prevent test flakiness from shared in-memory buckets
# RateLimitIntegrationTest overrides these via @SpringBootTest(properties = {...})
rate-limit:
  login-attempts-per-minute: 10000
  register-attempts-per-minute: 10000
  window-minutes: 1
